version: '3.8'

services:
  web:
    build: .
    container_name: digital_todo_wellness_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata fixtures/wellness_tips.json &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: digital_todo_wellness_redis
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    container_name: digital_todo_wellness_worker
    command: celery -A core worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - web
      - redis

  celery_beat:
    build: .
    container_name: digital_todo_wellness_beat
    command: celery -A core beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - web
      - redis
