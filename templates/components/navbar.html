<script>
function testUrgentChime() {
    fetch('/reminders/test-trigger/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ stage: 'URGENT' })
    }).then(res => res.json()).then(data => {
        if (data.success) {
            checkActiveReminders();
        }
    });
}
</script>
