{% extends 'base.html' %}

{% block title %}Password Reset Complete &bull; Digital To-Do &amp; Wellness Manager{% endblock %}

{% block content %}
<div class="row justify-content-center my-auto py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card-custom p-4 p-md-5 bg-white shadow-sm border-0 text-center" style="border-radius: 20px;">
            <div class="d-inline-flex p-3 rounded-circle bg-success-subtle text-success mb-3">
                <i class="bi bi-shield-check fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark mb-2">Password Reset Complete</h3>
            <p class="text-muted small mb-4">Your new password has been set. You may now log in to your account.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary rounded-pill px-4">Log In Now &rarr;</a>
        </div>
    </div>
</div>
{% endblock %}
