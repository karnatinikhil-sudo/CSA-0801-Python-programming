{% extends 'base.html' %}

{% block title %}Reset Password &bull; Digital To-Do &amp; Wellness Manager{% endblock %}

{% block content %}
<div class="row justify-content-center my-auto py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card-custom p-4 p-md-5 bg-white shadow-sm border-0" style="border-radius: 20px;">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
                    <i class="bi bi-key-fill fs-2"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Reset Password</h3>
                <p class="text-muted small">Enter your email address and we'll send you instructions to reset your password.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary py-2 fw-bold rounded-pill">
                        Send Reset Link &rarr;
                    </button>
                </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <a href="{% url 'accounts:login' %}" class="text-muted small">&larr; Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
